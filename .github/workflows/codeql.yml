name: CodeQL

# CodeQL doesn't analyse Dart; this scans the workflows themselves.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 7 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: actions
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
