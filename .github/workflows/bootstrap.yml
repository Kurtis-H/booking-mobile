# One-off: generate what `flutter create` would, plus the lock file, golden
# images and formatting, then commit them back to this branch. Runs only
# while the android/ folder doesn't exist yet. (Kept for reference; delete
# once the project is generated.)
name: Bootstrap Flutter project

on:
  push:
    branches: [build-app]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Already generated?
        id: check
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then echo "done=true" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.done != 'true'
        with:
          channel: stable
      - run: flutter --version
        if: steps.check.outputs.done != 'true'
      - name: Generate the Android project
        if: steps.check.outputs.done != 'true'
        run: |
          flutter create --platforms=android --org dev.kurtish --project-name booking_mobile .
          rm -f test/widget_test.dart
          manifest=android/app/src/main/AndroidManifest.xml
          # The app talks to the API over plain HTTP on the emulator (10.0.2.2).
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$manifest"
          head -12 "$manifest"
      - name: Newest compatible dependencies
        if: steps.check.outputs.done != 'true'
        run: flutter pub upgrade --major-versions
      - name: Apply fixes and format
        if: steps.check.outputs.done != 'true'
        run: |
          dart fix --apply
          dart format lib test integration_test tool
      - name: Analyzer report (not fatal here)
        if: steps.check.outputs.done != 'true'
        run: flutter analyze || true
      - name: Generate golden images
        if: steps.check.outputs.done != 'true'
        run: flutter test --update-goldens test/seat_map_golden_test.dart
      - name: Run the tests (report only)
        if: steps.check.outputs.done != 'true'
        run: flutter test || true
      - name: Check the Dart drills from the practice page
        if: steps.check.outputs.done != 'true'
        run: |
          mkdir -p /tmp/drills && cd /tmp/drills
          cat > d1.dart <<'D'
          void main() {
            String? name;
            print(name?.length ?? -1);
            name = 'Dart';
            print(name!.length);
          }
          D
          cat > d2.dart <<'D'
          void main() {
            final list = <int>[]
              ..add(3)
              ..add(1)
              ..sort();
            print(list);
          }
          D
          cat > d3.dart <<'D'
          Future<void> main() async {
            print('A');
            Future(() => print('B'));
            await Future.microtask(() => print('C'));
            print('D');
          }
          D
          cat > d4.dart <<'D'
          void main() {
            final scores = [72, 95, 88, 60];
            final passed = scores
                .where((s) => s >= 70)
                .map((s) => s ~/ 10)
                .toList();
            print(passed);
          }
          D
          for f in d1 d2 d3 d4; do echo "== $f: $(dart run $f.dart | tr '\n' ' ')"; done
      - name: Commit generated files
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate the Android project, lock file, goldens and formatting" -m "Generated by the bootstrap workflow (flutter create, pub upgrade, dart fix, dart format, --update-goldens)."
          git push
