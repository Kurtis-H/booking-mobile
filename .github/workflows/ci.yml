name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Analyze, unit, widget and golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting
        # On failure, show exactly what the formatter wants changed.
        run: |
          dart format lib test integration_test tool
          git diff --exit-code
      - name: Static analysis
        run: flutter analyze
      - name: Tests with coverage
        run: flutter test --coverage
      - name: At least 80% line coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 80
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: golden-failures
          path: test/**/failures/

  build:
    name: Build the Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  emulator:
    name: Integration tests and Maestro on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start the booking API (api-performance-lab)
        run: |
          pip install "git+https://github.com/Kurtis-H/api-performance-lab"
          python -m app.seed --events 30 --seats 40 --users 60
          RATE_LIMIT_PER_MINUTE=600 nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the app (pointing at the host machine from the emulator)
        # Profile builds are compiled ahead of time, so they start quickly on a
        # slow CI emulator; debug builds can take longer than Maestro waits.
        run: flutter build apk --profile --dart-define=API_URL=http://10.0.2.2:8000
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests, then Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # GitHub's Linux runners have 4 cores and 16 GB; the defaults (2 cores,
          # 2 GB) left system apps too slow to respond.
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Each stage has its own time limit, so a hang fails in minutes.
          script: |
            # Don't let a slow system app's "isn't responding" dialog cover the screen.
            adb shell settings put global hide_error_dialogs 1 || true
            ./tool/run_integration_tests.sh
            adb install -r build/app/outputs/flutter-apk/app-profile.apk
            timeout 4m maestro test .maestro/common/warm_up.yaml || echo "warm-up didn't finish; carrying on"
            timeout 12m maestro test .maestro --format junit --output maestro-report.xml --test-output-dir maestro-output || { echo '--- On screen'; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb shell cat /sdcard/ui.xml | tr '>' '\n' | grep -oE 'text="[^"]+"|content-desc="[^"]+"|resource-id="[^"]+"' | head -40; echo '--- Top activity'; adb shell dumpsys activity activities | grep -E 'ResumedActivity' | head -3; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-results
          path: |
            maestro-report.xml
            maestro-output/
            api.log
