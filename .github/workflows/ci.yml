name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Analyze, unit, widget and golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Static analysis
        run: flutter analyze
      - name: Tests with coverage
        run: flutter test --coverage
      - name: At least 80% line coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 80
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/**/failures/

  build:
    name: Build the Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  emulator:
    name: Integration tests and Maestro on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the booking API (api-performance-lab)
        run: |
          pip install "git+https://github.com/Kurtis-H/api-performance-lab"
          python -m app.seed --events 30 --seats 40 --users 60
          RATE_LIMIT_PER_MINUTE=600 nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the app (pointing at the host machine from the emulator)
        # Profile builds are compiled ahead of time, so they start quickly on a
        # slow CI emulator; debug builds can take longer than Maestro waits.
        run: flutter build apk --profile --dart-define=API_URL=http://10.0.2.2:8000
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests, then Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            flutter test integration_test --dart-define=API_URL=http://10.0.2.2:8000 -d emulator-5554
            adb install -r build/app/outputs/flutter-apk/app-profile.apk
            adb shell monkey -p dev.kurtish.booking_mobile -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
            sleep 15
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && adb shell cat /sdcard/ui.xml | tr '>' '\n' | grep -oE 'text="[^"]+"|content-desc="[^"]+"|resource-id="[^"]+"' | head -40 || true
            adb logcat -d -s flutter:V AndroidRuntime:E | tail -30 || true
            maestro test .maestro --format junit --output maestro-report.xml --test-output-dir maestro-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: |
            maestro-report.xml
            maestro-output/
            api.log
