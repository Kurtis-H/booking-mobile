name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: "Make new golden screenshots and print them to the log to review and commit"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update-goldens:
    name: Make new golden screenshots
    if: inputs.update_goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens test/goldens
      - name: Regenerate the consumer contract
        run: flutter test test/contract
      - name: Print the formatter's changes, if any
        run: dart format lib test integration_test tool && git diff -- '*.dart'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens
          path: |
            test/goldens/images/
            pacts/
      - name: Print the goldens (for environments that can read logs but not artifacts)
        run: |
          echo "----- BEGIN GOLDENS (tar.gz, base64) -----"
          tar czf - test/goldens/images pacts | base64 -w 0
          echo
          echo "----- END GOLDENS -----"

  test:
    name: Analyze, unit, widget and golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned: golden screenshots are only comparable on one Flutter version.
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - name: Formatting
        # On failure, show exactly what the formatter wants changed.
        run: |
          dart format lib test integration_test tool
          git diff --exit-code
      - name: Static analysis
        run: flutter analyze
      - name: Tests with coverage
        run: flutter test --coverage
      - name: At least 80% line coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 80
      - name: The committed consumer contract is up to date
        # The contract tests rewrite pacts/; api-performance-lab replays it from main.
        run: |
          if [ -n "$(git status --porcelain -- pacts/)" ]; then
            git status --porcelain -- pacts/
            git diff -- pacts/
            echo "--- The contract the tests generated:"
            cat pacts/booking-mobile-booking-api.json
            exit 1
          fi
      - name: Integration-run script reacts to passes, failures and hangs (no emulator)
        run: ./tool/test_run_integration_tests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-failures
          path: test/**/failures/

  build:
    name: Build the Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned: golden screenshots are only comparable on one Flutter version.
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: A release build without a release key fails, rather than using the debug key
        run: |
          if flutter build apk --release > release-no-key.log 2>&1; then
            echo "::error::release build succeeded without android/key.properties"; exit 1
          fi
          grep -q "validateSigningRelease" release-no-key.log || { cat release-no-key.log; exit 1; }
      - name: A throwaway release key, made for this run only
        working-directory: android
        run: |
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -noprompt -keystore app/ci-release.jks -storepass "$pass" -keypass "$pass" \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=booking-mobile CI"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=ci\nstoreFile=ci-release.jks\n' \
            "$pass" "$pass" > key.properties
      - run: flutter build apk --release
      - name: The release APK is signed with the release key and carries no demo key
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee signer.txt
          grep -q "CN=booking-mobile CI" signer.txt
          if grep -q "Android Debug" signer.txt; then
            echo "::error::release APK is signed with the debug certificate"; exit 1
          fi
          for lib in $(unzip -Z1 "$apk" | grep '/libapp.so$'); do
            if unzip -p "$apk" "$lib" | grep -aq "key-user-1"; then
              echo "::error::demo key found in $lib"; exit 1
            fi
          done

  emulator:
    name: Integration tests and Maestro on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Start the booking API (api-performance-lab)
        run: |
          pip install "git+https://github.com/Kurtis-H/api-performance-lab"
          python -m app.seed --events 30 --seats 40 --users 60
          # Unbuffered, so api.log shows every request when a job fails.
          PYTHONUNBUFFERED=1 RATE_LIMIT_PER_MINUTE=600 nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned: golden screenshots are only comparable on one Flutter version.
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - name: Build the app (pointing at the host machine from the emulator)
        # Profile builds are compiled ahead of time, so they start quickly on a
        # slow CI emulator; debug builds can take longer than Maestro waits.
        run: flutter build apk --profile --dart-define=API_URL=http://10.0.2.2:8000
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests, then Maestro flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # GitHub's Linux runners have 4 cores and 16 GB; the defaults (2 cores,
          # 2 GB) left system apps too slow to respond.
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Each stage has its own time limit, so a hang fails in minutes.
          script: |
            # Don't let a slow system app's "isn't responding" dialog cover the screen.
            adb shell settings put global hide_error_dialogs 1 || true
            ./tool/run_integration_tests.sh
            adb install -r build/app/outputs/flutter-apk/app-profile.apk
            timeout 4m maestro test .maestro/common/warm_up.yaml || echo "warm-up didn't finish; carrying on"
            timeout 12m maestro test .maestro --format junit --output maestro-report.xml --test-output-dir maestro-output || { echo '--- On screen'; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb shell cat /sdcard/ui.xml | tr '>' '\n' | grep -oE 'text="[^"]+"|content-desc="[^"]+"|resource-id="[^"]+"' | head -40; echo '--- Top activity'; adb shell dumpsys activity activities | grep -E 'ResumedActivity' | head -3; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: emulator-results
          path: |
            maestro-report.xml
            maestro-output/
            api.log
            integration-*.log
            diagnostics/
