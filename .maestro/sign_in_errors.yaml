# The sign-in screen explains what went wrong.
appId: dev.kurtish.booking_mobile
name: Sign-in errors
---
- launchApp:
    clearState: true
- runFlow: common/dismiss_system_dialogs.yaml
- extendedWaitUntil:
    visible: "Upcoming events"
    timeout: 120000
- tapOn: "Sign in"
- tapOn:
    text: "Sign in"
    index: 1
- assertVisible: "Enter an API key."
- tapOn: {id: "api-key-field"}
- inputText: "key-not-real"
- hideKeyboard
- tapOn:
    text: "Sign in"
    index: 1
- assertVisible: "That API key wasn't recognised."
