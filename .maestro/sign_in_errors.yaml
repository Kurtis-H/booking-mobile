# The sign-in screen explains what went wrong.
appId: dev.kurtish.booking_mobile
name: Sign-in errors
---
- runFlow: common/open_app.yaml
- tapOn: "Sign in"
- tapOn:
    text: "Sign in"
    index: 1
- assertVisible: "Enter an API key."
- tapOn: {id: "api-key-field"}
- inputText: "key-not-real"
- hideKeyboard
- tapOn:
    text: "Sign in"
    index: 1
- assertVisible: "That API key wasn't recognized."
