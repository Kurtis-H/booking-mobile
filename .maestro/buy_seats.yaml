# Browse, sign in with the demo account, buy two seats, then find the order.
# Runs against a freshly seeded API (CI), where Event 2's row-1 seats are $25.00.
appId: dev.kurtish.booking_mobile
name: Buy two seats
tags: [smoke]
---
- launchApp:
    clearState: true
- runFlow: common/dismiss_system_dialogs.yaml
- extendedWaitUntil:
    visible: "Upcoming events"
    timeout: 60000
- tapOn: "Sign in"
- tapOn: "Use the demo account"
- assertVisible: "Sign out"
- tapOn:
    id: "event-2"
- assertVisible: "Choose your seats"
- tapOn:
    id: "seat-R1-1"
- tapOn:
    id: "seat-R1-2"
- assertVisible: 'Total: \$50\.00'
- tapOn: "Buy 2 seats"
- assertVisible: "Thanks! Your order is confirmed."
- takeScreenshot: order-confirmed
- back
- tapOn: "My orders"
- assertVisible: "Order #.*"
